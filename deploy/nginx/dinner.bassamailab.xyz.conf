# /etc/nginx/sites-available/dinner.bassamailab.xyz
# Static PWA, no backend. Releases live in /var/www/dinner/releases/<stamp>; "current" is a symlink.
# Certbot (step 5) adds the 443/TLS lines to this file; do not hand-edit them afterwards.

server {
    # IPv4 only, like the other sites on this server (the domain has no AAAA record).
    listen 80;
    server_name dinner.bassamailab.xyz;

    root  /var/www/dinner/current;
    index index.html;
    charset utf-8;

    access_log /var/log/nginx/dinner.access.log;
    error_log  /var/log/nginx/dinner.error.log warn;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml application/manifest+json;

    # add_header is NOT inherited into a location that has its own add_header,
    # so every location includes the same security headers snippet.
    include snippets/dinner-security-headers.conf;

    # Hashed build files never change: cache for a year.
    location /assets/ {
        include snippets/dinner-security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Recipe photos: every reference carries ?v=<hash of the file>, so a replaced photo gets a new URL.
    location /recipes/ {
        include snippets/dinner-security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # The service worker, its helpers, the page and the version file must revalidate,
    # otherwise phones keep an old version of the app.
    location = /index.html {
        include snippets/dinner-security-headers.conf;
        add_header Cache-Control "no-cache" always;
    }
    location ~ ^/(sw\.js|registerSW\.js|workbox-[A-Za-z0-9_-]+\.js|version\.json)$ {
        include snippets/dinner-security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }
    # Older nginx builds lack the .webmanifest MIME type; set it here only.
    location = /manifest.webmanifest {
        include snippets/dinner-security-headers.conf;
        add_header Cache-Control "no-cache" always;
        types { }
        default_type application/manifest+json;
    }

    # Hidden files (.previous etc.) are never served.
    location ~ /\. { deny all; }

    # The app routes with #hash, so anything else falls back to the page.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
