name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Unit tests (data, engine, schedule, prices, migration, exports)
        run: npx vitest run --reporter=default --reporter=json --outputFile=test-results/unit.json
      - name: Production build
        run: npm run build
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Browser tests under the production CSP
        run: |
          pip install playwright==1.56.0
          python -m playwright install --with-deps chromium
          mkdir -p test-results
          python tests/e2e.py dist shots | tee test-results/e2e.txt
        shell: bash
      - name: Layout audit (covered text, clipping, sideways scroll, tap targets)
        run: python tests/ui_audit.py dist shots/audit | tee test-results/audit.txt
        shell: bash
      - name: Real-use checks (phone load, keyboard, axe, calendar, backup, site update)
        run: |
          pip install icalendar==6.1.3
          bash tests/build_next.sh /tmp/dist-next && npm run build
          python tests/realuse.py dist /tmp/dist-next shots/realuse | tee test-results/realuse.txt
        shell: bash
      - name: Test summary
        if: always()
        run: node scripts/test-summary.mjs | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: shots/
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-summary
          path: test-results/summary.md

  release:
    # When package.json carries a version that has no release yet, a push to main builds the
    # self-verifying deploy tarball and publishes it as GitHub Release v<version> (the tag is created here).
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Version and whether it is already released
        id: v
        run: |
          V=$(node -p "require('./package.json').version")
          echo "version=$V" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/v$V" >/dev/null; then echo "new=false" >> "$GITHUB_OUTPUT"; else echo "new=true" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/setup-node@v4
        if: steps.v.outputs.new == 'true'
        with:
          node-version: 22
          cache: npm
      - if: steps.v.outputs.new == 'true'
        run: npm ci && npm run build && bash scripts/release.sh
      - uses: actions/download-artifact@v4
        if: steps.v.outputs.new == 'true'
        with:
          name: test-summary
          path: test-results
      - name: Release notes from CHANGELOG.md and the test summary
        if: steps.v.outputs.new == 'true'
        run: bash scripts/release-notes.sh "${{ steps.v.outputs.version }}" > release-notes.md && cat release-notes.md
      - uses: softprops/action-gh-release@v2
        if: steps.v.outputs.new == 'true'
        with:
          tag_name: v${{ steps.v.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: v${{ steps.v.outputs.version }}
          files: |
            release/dinner-release-*.tar.gz
            release/dinner-release-*.tar.gz.sha256
          body_path: release-notes.md
